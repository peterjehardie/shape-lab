<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shape Lab</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Shape&nbsp;Lab</div>
    <div class="seg" id="viewModes" role="group" aria-label="View">
      <button data-view="color" class="on">Colour</button>
      <button data-view="value">Values</button>
      <button data-view="notan2">2-value</button>
      <button data-view="notan3">3-value</button>
      <button data-view="groups">Groups</button>
    </div>
    <label class="chk"><input type="checkbox" id="ovStructure" /> Structure</label>
    <div class="spacer"></div>
    <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button id="btnReseed" title="New random seed for every layer">Reseed all</button>
    <button id="btnGraph" class="toggle">Node graph</button>
    <button id="btnPng">Export PNG</button>
  </header>
  <main class="workspace">
    <aside class="panel left" id="layerPanel"></aside>
    <section class="stage">
      <div class="canvas-wrap"><canvas id="view" width="1600" height="900"></canvas></div>
      <div class="status" id="status"></div>
    </section>
    <aside class="panel right">
      <div class="tabs">
        <button data-tab="inspect" class="on">Inspector</button>
        <button data-tab="library">Library</button>
      </div>
      <div id="inspector" class="tabbody"></div>
      <div id="library" class="tabbody" hidden></div>
    </aside>
  </main>
  <section class="drawer" id="graphDrawer" hidden>
    <div id="graphEditor"></div>
  </section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
